<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Stratoblaster — Player ships</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0519;
        color: #f0e6ff;
        font-family: system-ui, sans-serif;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        background: #0d0519;
      }
      #fatal[hidden] {
        display: none;
      }
      .caption-row {
        position: fixed;
        bottom: 8%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        pointer-events: none;
      }
      .caption {
        flex: 1;
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
        text-shadow: 0 0 6px #4aa8ff;
      }
      .caption-title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="fatal" role="alert" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
