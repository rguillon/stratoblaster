name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code checks (ENG-71, ENG-73): ruff (lint and format), import-linter, mypy. No build: the e2e jobs
  # build the game (`make e2e-build` runs `make build` and its checks).
  lint:
    name: code check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10.3.3
      # Python 3.12 (pinned by pyproject.toml) is fetched by uv. Node is not used here, but the
      # Makefile checks its version before any step (node/.nvmrc).
      - uses: actions/setup-node@v7
        with:
          node-version-file: node/.nvmrc
      - run: make lint typecheck

  # Unit tests in CPython (pytest, ENG-40), with the coverage gates (ENG-43): no Transcrypt build.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: node/.nvmrc
      - run: make tests
      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            { echo '## Coverage (src/core)'; echo '```'; uv run coverage report; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  # Playwright (Python, Chromium) on the e2e build (ENG-72); traces, screenshots and videos of the
  # failed tests are kept (ENG-57). Software WebGL keeps a runner's CPU busy, so the tests are
  # spread over 4 jobs, each building the game and running its slice (D-219).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: node/.nvmrc
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # -j3: the two Transcrypt builds (game, e2e game) run side by side.
      - run: make -j3 e2e E2E_SHARD=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
