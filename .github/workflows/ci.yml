name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: node/.nvmrc
          cache: npm
          cache-dependency-path: node/package-lock.json
      # Python 3.12 (pinned by pyproject.toml) is fetched by uv; Node is for esbuild only.
      - run: make install
      # The build bundles the pinned Babylon.js (checked against its SHA-256, ENG-02).
      - run: make vendor
      # Unit tests run in CPython (pytest), with the core/ coverage gate (ENG-43).
      - run: make lint typecheck coverage build
      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            { echo '## Coverage (src/core)'; echo '```'; uv run coverage report; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  # Playwright (Python, Chromium) on the e2e build (ENG-72); traces, screenshots and videos of the
  # failed tests are kept (ENG-57).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: node/.nvmrc
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: make install
      - run: make vendor
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
