version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8.x only supports typescript <6.1; lift once it supports newer versions.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # eslint-plugin-import does not support eslint 10 yet; @eslint/js must match eslint's major.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
    groups:
      # Packages that must move together to keep peer dependencies consistent.
      lint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - 'eslint-*'
          - typescript
      test:
        patterns:
          - vitest
          - '@vitest/*'
          - '@playwright/test'
          - happy-dom
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
