[project]
name = "stratoblaster"
version = "0.0.0"
description = "Stratoblaster, a 3D shoot 'em up, compiled to JavaScript with Transcrypt."
# The project license (ENG-125), as in LICENSE.
license = { text = "MIT" }
# Python 3.12 only (ENG-01, ENG-154): Transcrypt 3.9.5 cannot compile its own runtime under
# Python 3.13 or later (ENG-04).
requires-python = ">=3.12,<3.13"
# No runtime Python dependency: the browser runs Transcrypt's output (ENG-05).
dependencies = []

# uv installs the tools from uv.lock (ENG-04); Transcrypt is pinned (ENG-03).
[dependency-groups]
dev = [
    "transcrypt==3.9.5",
    "ruff",
    "mypy",
    "import-linter",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.0.0",
    "ty>=0.0.95",
    "deptry>=0.25.1",
    "numpy>=2.5.4",
]
# torch for the AI player (`tests/ai/`), in one of two builds (D-289): `ai-cpu` (installed by
# default, CPU-only wheels) or `ai-cuda` (NVIDIA GPUs, CUDA 12.6: `make learn AI_TORCH=cuda`).
ai-cpu = ["torch>=2.14"]
ai-cuda = ["torch>=2.14"]

# Ruff lints (ENG-12) and formats (ENG-13); `make check` checks the format without writing.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

# The rule sets of ENG-12: N checks the naming (ENG-15), C90 and PL the size of the code (ENG-16).
[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL"]
# `# __pragma__ (...)` comments are Transcrypt directives (the skip blocks, ENG-153), not commented-out
# code (ERA001).
task-tags = ["TODO", "FIXME", "XXX", "__pragma__"]
ignore = [  "COM812",   # cause incompatibility with the formatter
            "ISC001",   # cause incompatibility with the formatter
            "D203",     # conflict with another rule
            "D213",     # conflict with another rule
            "D107",     # __init__ is documented by its class docstring
            "PLR2004",  # magic values ok
            "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in `*args`
            # What Transcrypt 3.9.5 imposes (specs/01-engineering.md, "Transcrypt"):
            "E711",     # `== None` also catches JavaScript's `undefined` (ENG-161)
            "FBT001",   # Transcrypt drops keyword arguments: flags are passed by position (ENG-151)
            "FBT002",   # same as FBT001
            "FBT003",   # same as FBT001
            "PLR0913",  # constructors take their many fields by position (ENG-151)
            "PLR0917",  # same as PLR0913
            "SIM118",   # Transcrypt cannot iterate a dict directly: `for k in d.keys()` (ENG-159)
            "SIM110",   # hot loops are plain loops: `any()`/`all()` over a generator are slow (ENG-157)
            "PLR1730",  # hot loops compare: Transcrypt's `min()`/`max()` are slow (ENG-157)
            "PLW0108",  # a bound method passed as a value loses `self`: keep the lambda
            "SIM105",   # Transcrypt has no `contextlib`
            "E722",     # a JavaScript error is no Python `Exception`: only a bare `except` catches it
            ]

[tool.ruff.lint.per-file-ignores]
# Tests assert on literal values: a magic number there is the expected value, not a constant
# (ENG-17).
"tests/*" = [ "S101",     # Allow assert in tests
              "D100",     # No docstring in tests
              "D101",     # No docstring in tests
              "D102",     # No docstring in tests
              "D103",     # No docstring in tests
              "D105",     # No docstring in tests
              "D107",     # No docstring in tests
              "INP001",   # tests is not a package
              "SLF001",   # tests inspect the internal state of what they test
              "N802",     # fakes mirror the camelCase names of Babylon and the DOM
              "N803",     # same as N802
              "N815",     # same as N802
              ]
# The ENG-18 ban on `time` is for core/: the e2e helpers wait in real time.
"tests/e2e/*" = ["TID251"]
# The AI player's command-line tools (`make learn`, `make rate`) print their progress, time
# themselves and draw their episodes at random: not core/'s deterministic simulation (ENG-18).
"tests/ai/*" = ["T201", "TID251", "S311"]
# Imports a module in a fresh interpreter (`sys.executable`, a fixed command).
"tests/unit/core/systems/test_boss_fights.py" = ["S603"]
# Babylon's own camelCase names (ENG-113).
"src/render/handles.py" = ["N802", "N803", "N815"]
# The DOM's method names, called on real browser objects.
"src/host/webgl_support.py" = ["N802"]
"src/input/keyboard_menu_input.py" = ["N802"]
# Config record keys stay camelCase: the browser reads them as object fields (ENG-15).
"src/game/sim/enemies/hornet.py" = ["N802"]
# Arguments read by the JavaScript of `__pragma__("js", ...)` bodies, where ruff cannot see them.
"src/main.py" = ["ARG001"]
"src/app/debug_options.py" = ["ARG001"]
"src/app/page_fullscreen.py" = ["ARG001"]
"src/app/saved_choices.py" = ["ARG001"]
"src/app/saved_settings.py" = ["ARG001"]
"src/app/saved_supplies.py" = ["ARG001"]
"src/app/saved_weapons.py" = ["ARG001"]
"src/debug/remote_player.py" = ["ARG001"]
"src/game/view/audio/game_audio.py" = ["ARG001"]
"src/game/view/reactor_flame.py" = ["ARG001"]
"src/game/view/readability_view.py" = ["ARG001"]
"src/game/view/ship_materials.py" = ["ARG001", "N803"]  # N803: config record keys (ENG-15)
"src/game/view/ship_parts.py" = ["ARG001"]
"src/game/view/shot_geometry.py" = ["ARG001"]
"src/game/view/shots/bullet_renderer.py" = ["ARG001"]
"src/game/view/shots/impact_flashes.py" = ["ARG001"]
"src/game/view/shots/laser_renderer.py" = ["ARG001"]
"src/game/view/shots/missile_exhaust.py" = ["ARG001"]
"src/game/view/shots/missile_model.py" = ["ARG001"]
"src/game/view/shots/missile_renderer.py" = ["ARG001"]
"src/host/cookie_storage.py" = ["ARG001"]
"src/host/worker_data.py" = ["ARG001"]
"src/render/babylon.py" = ["ARG001"]
"src/render/scenery/background_loader.py" = ["ARG001"]
"src/render/scenery/ground_worker.py" = ["ARG001"]
"src/render/scenery/imposter_bake_visual.py" = ["ARG001"]
"src/render/scenery/level_ground.py" = ["ARG001"]
"src/render/scenery/procedural_textures.py" = ["ARG001"]
"src/render/scenery/prop_field.py" = ["ARG001"]
"src/render/scenery/road_atlas.py" = ["ARG001"]
"src/render/scenery/road_field.py" = ["ARG001"]
"src/render/scenery/road_sources.py" = ["ARG001"]
"src/render/scenery/scenery_stage.py" = ["ARG001"]
"src/render/scenery/terrain_blend_plugin_visual.py" = ["ARG001"]
"src/render/scenery/terrain_chunks.py" = ["ARG001"]
"src/render/scenery/window_atlas.py" = ["ARG001"]
"src/ui/screens/elements.py" = ["ARG001"]
# A node stopped earlier throws when stopped again: ignored, as Transcrypt has no `contextlib`.
"src/audio/synth.py" = ["S110"]
# `__pragma__` is Transcrypt's compiler marker, not a dunder of ours.
"tests/helpers/typings/*" = ["N807"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "ENG-18: core/ uses the seeded RNG (core/math/rng.py), never the random module."
"time".msg = "ENG-18: core/ receives dt from the loop, never reads the clock."
"datetime".msg = "ENG-18: core/ receives dt from the loop, never reads the clock."

# ENG-16: cyclomatic complexity at most 10.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6


[tool.ruff.format]
preview = true

# deptry (`make check`): `org` is Transcrypt's compile-time stub package (`transcrypt/modules/org`,
# ENG-153), not an installed module; the game has no runtime Python dependency (ENG-05).
[tool.deptry.per_rule_ignores]
DEP001 = ["org"]

# ENG-14: mypy --strict over src/ (`make check`); the browser globals' stubs are in tests/helpers/typings/.
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
mypy_path = ["src", "tests/helpers/typings"]

[tool.pytest.ini_options]
# Unit tests run in CPython on the modules of src/ (ENG-40). The Transcrypt stubs (`org`) are added
# by tests/unit/conftest.py.
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
pythonpath = ["src", "tests"]
# importlib: source modules share basenames (game_play, outline, ...), so test modules must too
# (ENG-49).
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
# Every module of src/ is measured, including those no test imports (they show at 0 %): `source`
# makes coverage read the files it did not run. ENG-45: only the entry points and the generated
# build info are left out.
source = ["src"]
branch = true
omit = [
    "src/main.py",
    "src/worker_main.py",
    "src/build_info.py",
]

[tool.coverage.report]
skip_empty = false
fail_under = 100
show_missing = true
skip_covered = true

[tool.importlinter]
root_packages = [
    "app",
    "assets",
    "audio",
    "config",
    "core",
    "debug",
    "game",
    "host",
    "input",
    "render",
    "ui",
]
include_external_packages = true

# The layering rule of ENG-11 for core/, checked by `make check`, not just written down (the game/
# directions of ENG-142 have no contract yet).
[[tool.importlinter.contracts]]
name = "core/ is pure: no browser or DOM"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["org", "browser"]
# Each module below imports __pragma__ only as a compile-time marker for Transcrypt (it skips
# the typing names and never touches the DOM, ENG-153). Any other import of org or browser fails
# `make check`.
ignore_imports = [
    "core.content.game_definition -> org",
    "core.content.game_level -> org",
    "core.content.menu_texts -> org",
    "core.entities.boss -> org",
    "core.entities.boss_joint -> org",
    "core.entities.boss_pieces -> org",
    "core.entities.boss_turret -> org",
    "core.entities.enemy -> org",
    "core.entities.jointed_enemy -> org",
    "core.entities.muzzle -> org",
    "core.entities.shot_target -> org",
    "core.entities.weapon -> org",
    "core.math.color -> org",
    "core.math.min_heap -> org",
    "core.math.bits -> org",
    "core.math.noise -> org",
    "core.math.pixel_contrast -> org",
    "core.math.rng -> org",
    "core.menu.grid_cursor -> org",
    "core.menu.menu_screen -> org",
    "core.scenery.atmosphere -> org",
    "core.scenery.away_placement -> org",
    "core.scenery.block_towers -> org",
    "core.scenery.district_packing -> org",
    "core.scenery.districts -> org",
    "core.scenery.draws -> org",
    "core.scenery.float_placement -> org",
    "core.scenery.ground_boxes -> org",
    "core.scenery.ground_fit -> org",
    "core.scenery.height_field -> org",
    "core.scenery.ice_sculpt -> org",
    "core.scenery.lanes -> org",
    "core.scenery.lightning -> org",
    "core.scenery.ordering -> org",
    "core.scenery.prop_placement -> org",
    "core.scenery.road_network -> org",
    "core.scenery.road_paths -> org",
    "core.scenery.road_segments -> org",
    "core.scenery.road_tiles -> org",
    "core.scenery.road_traffic -> org",
    "core.scenery.road_types -> org",
    "core.scenery.scenery_level -> org",
    "core.scenery.sky_look -> org",
    "core.scenery.street_dead_ends -> org",
    "core.scenery.street_grid -> org",
    "core.scenery.street_links -> org",
    "core.scenery.street_runs -> org",
    "core.scenery.tile_packing -> org",
    "core.scenery.tile_streets -> org",
    "core.scenery.traffic -> org",
    "core.systems.beam -> org",
    "core.systems.bonus_world -> org",
    "core.systems.boss_fights -> org",
    "core.systems.boss_pattern -> org",
    "core.systems.enemy_motion -> org",
    "core.systems.enemy_shots -> org",
    "core.systems.enemy_world -> org",
    "core.systems.gun_muzzles -> org",
    "core.systems.level_models -> org",
    "core.systems.level_run -> org",
    "core.systems.level_run_types -> org",
    "core.systems.player_flight -> org",
    "core.systems.player_hits -> org",
    "core.systems.player_hull -> org",
    "core.systems.projectile_motion -> org",
    "core.systems.run_arsenal -> org",
    "core.systems.ship_journey -> org",
    "core.systems.shot_world -> org",
    "core.systems.wave_runner -> org",
    # config/ is now analysed (root package), and these two import __pragma__ as the same marker.
    "config.time_of_day -> org",
    "config.weather -> org",
]

# ENG-11, ENG-142: the dependency direction of the game/ split, checked by `make check`. main.py
# and build_info.py are modules, not packages, so import-linter cannot check their imports.
[[tool.importlinter.contracts]]
name = "game/sim/ imports only core/, config/ and game/sim, game/config"
type = "forbidden"
source_modules = ["game.sim"]
forbidden_modules = [
    "app",
    "assets",
    "audio",
    "debug",
    "host",
    "input",
    "render",
    "ui",
    "game.index",
    "game.view",
]

[[tool.importlinter.contracts]]
name = "game/config/ imports only game/config/"
type = "forbidden"
source_modules = ["game.config"]
forbidden_modules = [
    "app",
    "assets",
    "audio",
    "config",
    "core",
    "debug",
    "host",
    "input",
    "render",
    "ui",
    "game.index",
    "game.sim",
    "game.view",
]

[[tool.importlinter.contracts]]
name = "game/view/ imports only render, audio, ui, assets, config, core, game/sim, game/config"
type = "forbidden"
source_modules = ["game.view"]
forbidden_modules = [
    "app",
    "debug",
    "host",
    "input",
    "game.index",
]

[[tool.importlinter.contracts]]
name = "no module outside game/ imports game/"
type = "forbidden"
source_modules = [
    "app",
    "assets",
    "audio",
    "config",
    "core",
    "debug",
    "host",
    "input",
    "render",
    "ui",
]
forbidden_modules = ["game"]

# The AI player's torch (`tests/ai/`, D-288, D-289): the CPU-only wheels by default (no CUDA
# libraries in dev installs or CI), the CUDA 12.6 ones in the `ai-cuda` group (any driver >= 525,
# GPUs from the GTX 10 / RTX 20 series on). The two groups cannot be installed together.
[tool.uv]
default-groups = ["dev", "ai-cpu"]
conflicts = [[{ group = "ai-cpu" }, { group = "ai-cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "ai-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", group = "ai-cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
