<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Stratoblaster</title>
    <style>
      /*
       * Cyberpunk HUD look (GD-60, P01-R13, review feedback D-013, D-014): acid yellow, cyan
       * and alarm red on black, chamfered panels, monospace readouts. The selected
       * entry is a solid yellow block, with its markers. System fonts only: works offline.
       */
      :root {
        --yellow: #fcee0a;
        --cyan: #00f0ff;
        --red: #ff2a55;
        --black: #050508;
        --paper: #f2f2f7;
        --dim: #8a8aa0;
        --glass: rgba(6, 8, 18, 0.78);
        --letterbox: #020204;
        --font:
          'Bahnschrift', 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', system-ui,
          sans-serif;
        --font-tech: 'Consolas', 'Menlo', 'DejaVu Sans Mono', 'Liberation Mono', monospace;
        --cut: 14px;
        /* Panel with its top-left and bottom-right corners cut off. */
        --chamfer: polygon(
          var(--cut) 0,
          100% 0,
          100% calc(100% - var(--cut)),
          calc(100% - var(--cut)) 100%,
          0 100%,
          0 var(--cut)
        );
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--letterbox);
        color: var(--paper);
        font-family: var(--font);
      }
      #stage {
        position: fixed;
        overflow: hidden;
        background: var(--black);
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #menu {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-size: 22px;
        line-height: 1.5;
        background: var(--letterbox);
      }
      #fatal[hidden] {
        display: none;
      }

      .menu-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        padding: 24px 16px;
        text-align: center;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
      }
      /* HUD frame: yellow and cyan corner brackets around the screen. */
      .menu-screen::before {
        content: '';
        position: absolute;
        inset: 6px;
        pointer-events: none;
        --size: 22px;
        background:
          linear-gradient(var(--yellow), var(--yellow)) top left / var(--size) 3px no-repeat,
          linear-gradient(var(--yellow), var(--yellow)) top left / 3px var(--size) no-repeat,
          linear-gradient(var(--cyan), var(--cyan)) top right / var(--size) 2px no-repeat,
          linear-gradient(var(--cyan), var(--cyan)) top right / 2px var(--size) no-repeat,
          linear-gradient(var(--cyan), var(--cyan)) bottom left / var(--size) 2px no-repeat,
          linear-gradient(var(--cyan), var(--cyan)) bottom left / 2px var(--size) no-repeat,
          linear-gradient(var(--yellow), var(--yellow)) bottom right / var(--size) 3px no-repeat,
          linear-gradient(var(--yellow), var(--yellow)) bottom right / 3px var(--size) no-repeat;
      }
      /* Decorative status tag in the top right corner. */
      .menu-screen::after {
        content: 'NET//LINK OK';
        position: absolute;
        top: 16px;
        right: 22px;
        pointer-events: none;
        font-family: var(--font-tech);
        font-size: 10px;
        letter-spacing: 0.15em;
        color: var(--cyan);
        opacity: 0.75;
      }
      .menu-enter {
        animation-name: menu-fade;
        animation-timing-function: ease-out;
      }
      @keyframes menu-fade {
        from {
          opacity: 0;
          transform: translateX(-10px);
          filter: brightness(2.5);
        }
      }
      .menu-entry {
        cursor: pointer;
        box-sizing: border-box;
        min-width: 44px;
        min-height: 44px;
        border: 2px solid rgba(0, 240, 255, 0.45);
        background:
          linear-gradient(-45deg, var(--cyan) 0 7px, transparent 7px) bottom right / 16px 16px
            no-repeat,
          var(--glass);
      }
      /* Selected entry: solid yellow block with black text, plus its markers, so it shows
         without colour too (much lighter than the dark panels in greyscale). */
      .menu-entry.selected {
        border-color: var(--paper);
        color: var(--black);
        text-shadow: none;
        background:
          linear-gradient(-45deg, var(--black) 0 7px, transparent 7px) bottom right / 16px 16px
            no-repeat,
          var(--yellow);
        box-shadow: 0 0 18px rgba(252, 238, 10, 0.55);
      }
      .menu-heading {
        margin: 68px 0 0;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--paper);
        text-shadow:
          -2px 0 var(--red),
          2px 0 var(--cyan),
          0 0 4px rgba(0, 0, 0, 0.9);
      }
      .menu-heading::before {
        content: '// ';
        color: var(--yellow);
      }
      .menu-hint {
        font-family: var(--font-tech);
        font-size: 15px;
        color: var(--cyan);
      }
      .menu-hint::before {
        content: '> ';
        color: var(--yellow);
      }
      .menu-hint::after {
        content: '_';
        animation: cursor-blink 1s steps(1) infinite;
      }
      @keyframes cursor-blink {
        50% {
          opacity: 0;
        }
      }
      .menu-back {
        position: absolute;
        left: 12px;
        top: 12px;
        /* ≥ 44 CSS px even on a 390 px wide phone (scale 0.81). */
        min-width: 96px;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 0 12px;
        border: 2px solid var(--cyan);
        clip-path: var(--chamfer);
        background: var(--glass);
        color: var(--cyan);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .shake {
        animation: menu-shake 0.3s linear;
      }
      @keyframes menu-shake {
        20%,
        60% {
          translate: -6px 0;
        }
        40%,
        80% {
          translate: 6px 0;
        }
      }

      .loading-screen {
        justify-content: center;
        gap: 16px;
        background:
          linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px) 0 0 / 32px 32px,
          linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px) 0 0 / 32px 32px,
          var(--black);
      }
      .loading-text {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--yellow);
        text-shadow:
          -2px 0 var(--red),
          2px 0 var(--cyan);
      }
      .loading-bar {
        width: 320px;
        height: 24px;
        box-sizing: border-box;
        padding: 3px;
        border: 2px solid var(--yellow);
        overflow: hidden;
        background: var(--glass);
      }
      /* Segmented fill, like a power gauge. */
      .loading-fill {
        height: 100%;
        background:
          repeating-linear-gradient(90deg, transparent 0 10px, var(--black) 10px 13px),
          var(--yellow);
      }
      .loading-percent {
        font-family: var(--font-tech);
        font-size: 18px;
        color: var(--cyan);
      }

      .title-score-label {
        font-family: var(--font-tech);
        font-size: 15px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--cyan);
      }
      .title-high-score {
        font-family: var(--font-tech);
        font-size: 32px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--yellow);
      }
      /* Logo: black letters on a chamfered yellow plate, with a red / cyan glitch split. */
      .title-name {
        margin: 40px 0 0;
        padding: 6px 24px;
        clip-path: var(--chamfer);
        /* Sized so the 13-letter "Stratoblaster" fits the 480 px wide screen; shrinkToFit()
           lowers it when the system falls back to a wider font. */
        font-size: 46px;
        font-weight: 900;
        font-style: italic;
        letter-spacing: 0.05em;
        white-space: nowrap;
        text-transform: uppercase;
        color: var(--black);
        background:
          repeating-linear-gradient(rgba(0, 0, 0, 0.08) 0 2px, transparent 2px 4px), var(--yellow);
        text-shadow:
          -3px 0 var(--red),
          3px 0 var(--cyan);
        animation: title-glitch 4s steps(1) infinite;
      }
      @keyframes title-glitch {
        92% {
          text-shadow:
            -7px 0 var(--red),
            6px 0 var(--cyan);
          translate: 3px 0;
        }
        94% {
          text-shadow:
            -3px 0 var(--red),
            3px 0 var(--cyan);
          translate: 0 0;
        }
      }
      .title-start {
        margin-top: 56px;
        padding: 10px 28px;
        clip-path: var(--chamfer);
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .title-start.selected::before {
        content: '▶ ';
      }
      .title-start.selected::after {
        content: ' ◀';
      }
      .title-hint {
        margin-top: auto;
        margin-bottom: 28px;
      }
      .title-version {
        position: absolute;
        right: 16px;
        bottom: 14px;
        font-family: var(--font-tech);
        font-size: 11px;
        text-align: right;
        color: var(--cyan);
        opacity: 0.85;
      }

      .ship-cards {
        display: flex;
        margin-top: auto;
      }
      .ship-card {
        flex: 1;
        margin: 0 3px;
        padding: 6px 2px 8px;
        clip-path: var(--chamfer);
        font-size: 12px;
        line-height: 1.5;
        opacity: 0.6;
      }
      .ship-card::before {
        content: '▲';
        display: block;
        font-size: 16px;
        line-height: 1;
        visibility: hidden;
      }
      .ship-card.selected::before {
        visibility: visible;
      }
      .ship-card.selected {
        opacity: 1;
      }
      .ship-card-name {
        white-space: nowrap;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .ship-select-screen .menu-hint {
        margin: 12px 0 8px;
      }

      .level-grid {
        display: grid;
        gap: 10px;
        margin-top: 40px;
      }
      /* No clip-path here: it would hide the dashed outline of the selected cell. */
      .level-cell {
        position: relative;
        width: 68px;
        height: 68px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: var(--font-tech);
        font-size: 22px;
        font-weight: 700;
      }
      .level-cell:not(.locked) {
        border-color: var(--cyan);
      }
      .level-cell.selected:not(.locked) {
        border-color: var(--paper);
      }
      /* Locked: dim, hazard-striped panel; selected, a red frame instead of the yellow block. */
      .level-cell.locked {
        color: var(--dim);
        border-color: rgba(138, 138, 160, 0.3);
        background:
          repeating-linear-gradient(-45deg, rgba(138, 138, 160, 0.1) 0 6px, transparent 6px 12px),
          rgba(14, 14, 22, 0.85);
        text-shadow: none;
        box-shadow: none;
      }
      .level-cell.locked.selected {
        color: var(--red);
        border-color: var(--red);
      }
      .level-cell.selected {
        outline: 3px dashed var(--paper);
        outline-offset: 3px;
      }
      .padlock {
        width: 18px;
        height: 18px;
        margin-top: 2px;
      }
      .menu-status {
        min-height: 32px;
        margin-top: 16px;
        font-family: var(--font-tech);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--red);
      }

      /* Game screen (P06-R02): the playfield shows through; drag anywhere to fly (touch). */
      .game-screen {
        justify-content: center;
        touch-action: none;
      }
      .game-level {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        padding: 2px 12px;
        font-family: var(--font-tech);
        font-size: 14px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--yellow);
        background: var(--glass);
        pointer-events: none;
      }
      /* The decorative status tag would sit on the weapon readout. */
      .game-screen::after {
        content: none;
      }
      /* In-game HUD (phase 6 review): health, weapon, progress, kills. Never takes clicks. */
      .game-hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: var(--font-tech);
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--paper);
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
      }
      .hud-health {
        position: absolute;
        top: 14px;
        left: 18px;
        width: 140px;
        padding: 4px 8px 6px;
        background: var(--glass);
        clip-path: var(--chamfer);
      }
      .hud-ship {
        color: var(--yellow);
        text-transform: uppercase;
      }
      .hud-bar {
        height: 8px;
        margin: 4px 0 3px;
        border: 1px solid var(--cyan);
        background: rgba(0, 0, 0, 0.5);
      }
      .hud-bar-fill {
        height: 100%;
        background: var(--cyan);
        box-shadow: 0 0 6px var(--cyan);
      }
      .hud-bar-fill.low {
        background: var(--red);
        box-shadow: 0 0 6px var(--red);
      }
      .hud-name {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
      }
      .hud-lives {
        color: var(--cyan);
        white-space: nowrap;
      }
      .hud-health-text {
        font-size: 11px;
      }
      .hud-weapon {
        position: absolute;
        top: 14px;
        right: 18px;
        padding: 4px 8px;
        color: var(--yellow);
        background: var(--glass);
      }
      .hud-progress {
        position: absolute;
        top: 44px;
        left: 50%;
        width: 140px;
        height: 4px;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(252, 238, 10, 0.6);
      }
      .hud-progress-fill {
        height: 100%;
        background: var(--yellow);
      }
      .hud-destroyed {
        position: absolute;
        bottom: 18px;
        left: 18px;
        padding: 3px 8px;
        background: var(--glass);
      }
      /* Score and high score (P11-R02): top centre, above the progress bar. */
      .hud-score {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        white-space: nowrap;
      }
      .hud-score-value {
        font-size: 18px;
        font-weight: 700;
        line-height: 20px;
        color: var(--yellow);
      }
      .hud-high-score {
        font-size: 10px;
        line-height: 12px;
        color: var(--cyan);
      }
      /* Bombs left (P11-R05), one icon each, under the health bar. */
      .hud-bombs {
        min-height: 12px;
        font-size: 11px;
        line-height: 12px;
        letter-spacing: 0.2em;
        color: #ff8a1e;
      }
      /* Touch bomb button (P11-R06), above the fire button, only on touch screens. */
      .hud-bomb-button {
        display: none;
        position: absolute;
        z-index: 5;
        right: 22px;
        bottom: 132px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--black);
        background: rgba(255, 138, 30, 0.55);
        border: 3px solid #ff8a1e;
        text-shadow: none;
        pointer-events: auto;
        touch-action: none;
      }
      .hud-bomb-button.empty {
        opacity: 0.35;
      }
      @media (pointer: coarse) {
        .hud-bomb-button {
          display: flex;
        }
      }
      /* Boss health bar (P07-R02): centred under the HUD, a notch at the end of each part. */
      .boss-bar {
        position: absolute;
        top: 72px;
        left: 50%;
        width: 290px;
        transform: translateX(-50%);
        padding: 4px 10px 7px;
        background: var(--glass);
        clip-path: var(--chamfer);
      }
      .boss-bar[hidden] {
        display: none;
      }
      .boss-label {
        display: flex;
        gap: 8px;
        align-items: baseline;
        text-transform: uppercase;
      }
      .boss-rank {
        font-size: 11px;
        color: var(--red);
        letter-spacing: 0.15em;
      }
      .boss-name {
        color: var(--yellow);
      }
      .boss-track {
        position: relative;
        height: 9px;
        margin-top: 4px;
        border: 1px solid var(--red);
        background: rgba(0, 0, 0, 0.55);
      }
      .boss-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--red), var(--yellow));
        box-shadow: 0 0 6px var(--red);
      }
      .boss-notch {
        position: absolute;
        top: -2px;
        bottom: -2px;
        width: 2px;
        margin-left: -1px;
        background: var(--paper);
        opacity: 0.8;
      }
      /* Touch fire button, only on touch screens (keyboard and gamepad have their own). */
      .game-fire {
        display: none;
        position: absolute;
        right: 22px;
        bottom: 26px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        font-family: var(--font-tech);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--black);
        background: rgba(252, 238, 10, 0.55);
        border: 3px solid var(--yellow);
        text-shadow: none;
      }
      @media (pointer: coarse) {
        .game-fire {
          display: flex;
        }
      }
      /* "Level complete" overlay (P06-R03). */
      .level-complete {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px 32px;
        clip-path: var(--chamfer);
        border: 2px solid var(--yellow);
        background: var(--glass);
        color: var(--paper);
      }
      .level-complete.menu-entry.selected {
        color: var(--paper);
        background: var(--glass);
      }
      .level-complete-heading {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--yellow);
      }
      .level-complete-level {
        font-family: var(--font-tech);
        font-size: 40px;
        font-weight: 700;
        color: var(--cyan);
      }
      .level-complete-enemies {
        font-size: 22px;
      }
      /* The attempt's score, and a new high score (P11-R03). */
      .level-complete-score {
        font-family: var(--font-tech);
        font-size: 24px;
        color: var(--yellow);
      }
      .level-complete-high-score {
        font-size: 20px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--cyan);
      }
      .level-complete.game-over {
        border-color: var(--red);
      }
      .game-over .level-complete-heading {
        color: var(--red);
      }
      /* Game over after the mini boss (P07-R08): Continue from the checkpoint, or level select. */
      .level-complete-choices {
        display: flex;
        gap: 12px;
      }
      .level-complete-choice {
        padding: 6px 14px;
        font-size: 20px;
        font-weight: 700;
        text-transform: uppercase;
        border: 2px solid var(--dim);
        color: var(--paper);
      }
      .level-complete-choice.selected {
        border-color: var(--yellow);
        color: var(--black);
        background: var(--yellow);
      }

      /* Debug tile (P06-R09): frame rate and polygons drawn, top right of the window. */
      .stats-tile {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 10;
        padding: 6px 10px;
        background: rgba(6, 8, 18, 0.8);
        border: 1px solid rgba(252, 238, 10, 0.5);
        font-family: var(--font-tech);
        font-size: 12px;
        line-height: 1.5;
        color: var(--yellow);
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .title-name,
        .menu-hint::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game-canvas"></canvas>
      <div id="menu"></div>
    </div>
    <div id="fatal" role="alert" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
