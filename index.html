<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Stratoblaster</title>
    <style>
      /*
       * Cyan neon night, made clear (owner, 2026-11-11, D-324; synthwave pink D-323, neon
       * blue/green D-198 before): a blue-black ramp, one electric cyan accent, a cast chrome logo
       * with a hard teal edge (the title's one rich moment, UI-LOOK-12) and a cyan horizon line
       * under the headings (the signature, UI-LOOK-06). Nothing in the chrome glows; fills are
       * solid (UI-LOOK-03). Red stays for danger, orange for the bombs (UI-LOOK-04), green for
       * good things. Large type for kids, sentence case, 4 px grid (UI-LOOK-09). System fonts
       * only (UI-LOOK-11).
       */
      :root {
        --night: #010a10;
        --letterbox: #000407;
        --glass: rgba(4, 18, 28, 0.86);
        --glass-2: rgba(10, 34, 48, 0.92);
        --text: #ecfdff;
        --text-2: #9fbcc4;
        --text-3: #5f7f89;
        --line: rgba(236, 253, 255, 0.12);
        --line-2: rgba(236, 253, 255, 0.24);
        --cyan: #00e8ff;
        --on-accent: #01141c;
        --green: #3dff9a;
        --red: #ff3b47;
        --orange: #ff9a2e;
        --outline: 0 1px 2px rgba(0, 4, 7, 0.9), 0 0 2px rgba(0, 4, 7, 0.9);
        --r-control: 8px;
        --r-panel: 16px;
        --ease: cubic-bezier(0.2, 0, 0, 1);
        /* D-249: width of the menus' column in the middle of the 16:9 screen (UI-LOOK-02). */
        --menu-column: 560px;
        /* D-252, D-263: width of the side columns round the 540 px wide playfield window, where
           the level is drawn; since D-317 the HUD is laid over the window, the columns are empty
           but for the touch buttons (UI-HUD-01). */
        --hud-side: 370px;
        --font:
          'Bahnschrift', 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', system-ui,
          sans-serif;
        --font-tech: 'Consolas', 'Menlo', 'DejaVu Sans Mono', 'Liberation Mono', monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--letterbox);
        color: var(--text);
        font-family: var(--font);
        font-weight: 500;
      }
      /* No screen overlay on the stage (UI-LOOK-07); #menu, laid out at the logical resolution,
         is scaled over it (UI-LOOK-01). */
      #stage {
        position: fixed;
        overflow: hidden;
        background: var(--night);
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #menu {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      /* Phone layout (UI-LOOK-02, D-286): on a stage scaled under 0.5 (`PHONE_SCALE`), every menu,
         the pause menu and the end-of-level panels are laid out across the whole window at their
         real size, so their touch targets keep their 44 CSS px (UI-INPUT-11). The HUD of a level
         being played (`.on-play`) keeps to the stage; under a panel it is hidden. */
      #menu.phone:not(.on-play) {
        position: fixed;
        left: 0 !important;
        top: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        transform: none !important;
      }
      /* The menus have the game's aspect ratio (D-319): every screen is laid out in the 540 x 720
         playfield window in the middle of the stage, between opaque night side columns with a
         hairline on the window's edges, the same round a level (UI-LOOK-02, D-317). The game
         screen keeps the whole stage (its HUD is laid over the window itself), the dev viewer's 3D
         views the whole stage, a phone's menus the whole window (D-286). */
      #menu:not(.phone):not(:has(.dev-viewer-screen))::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          var(--night) calc(var(--hud-side) - 1px),
          var(--line-2) calc(var(--hud-side) - 1px) var(--hud-side),
          transparent var(--hud-side) calc(100% - var(--hud-side)),
          var(--line-2) calc(100% - var(--hud-side)) calc(100% - var(--hud-side) + 1px),
          var(--night) calc(100% - var(--hud-side) + 1px)
        );
      }
      #menu:not(.phone) .menu-screen:not(.game-screen, .dev-viewer-screen) {
        left: var(--hud-side);
        right: var(--hud-side);
      }
      #menu.phone .level-cell {
        width: 60px;
        height: 60px;
      }
      #menu.phone:not(.on-play) .game-hud,
      #menu.phone:not(.on-play) .boss-bar,
      #menu.phone:not(.on-play) .game-level,
      #menu.phone:not(.on-play) .game-fire {
        display: none;
      }
      /* The message shown when the game cannot run (UI-LOAD-02). */
      #fatal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-size: 22px;
        line-height: 1.5;
        background: var(--letterbox);
      }
      #fatal[hidden] {
        display: none;
      }

      /* A menu screen: a column, centred, on the 4 px grid. No frame and no bottom line: the
         window's hairline is its edge (UI-LOOK-06). */
      .menu-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        padding: 24px 16px;
        text-align: center;
        text-shadow: var(--outline);
      }
      /* Short screen transitions (UI-FLOW-08): a fade and an 8 px rise. */
      .menu-enter {
        animation-name: menu-fade;
        animation-timing-function: var(--ease);
      }
      @keyframes menu-fade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .menu-entry {
        cursor: pointer;
        box-sizing: border-box;
        min-width: 44px;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: var(--r-control);
        background: var(--glass);
        color: var(--text);
        font-weight: 600;
        transition:
          background-color 120ms var(--ease),
          border-color 120ms var(--ease),
          color 120ms var(--ease);
      }
      .menu-entry:hover {
        border-color: var(--line-2);
        background: var(--glass-2);
      }
      .menu-entry:focus-visible,
      .menu-back:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }
      /* Selected entry: a solid cyan block with dark text, plus its markers, so it shows
         without colour too (much lighter than the dark panels in greyscale, UI-LOOK-08). */
      .menu-entry.selected,
      .menu-entry.selected:hover {
        border-color: var(--cyan);
        color: var(--on-accent);
        text-shadow: none;
        background: var(--cyan);
      }
      /* Headings over the horizon line, the UI's signature (UI-LOOK-06). */
      .menu-heading,
      .pause-heading,
      .level-complete-heading {
        position: relative;
        margin: 0;
        padding-bottom: 16px;
        font-size: 32px;
        font-weight: 600;
        line-height: 40px;
        color: var(--text);
      }
      .menu-heading::after,
      .pause-heading::after,
      .level-complete-heading::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 48px;
        height: 2px;
        margin-left: -24px;
        background: var(--cyan);
      }
      .menu-heading {
        margin-top: 64px;
      }
      /* Hints: secondary text, still (UI-LOOK-14). */
      .menu-hint {
        font-size: 16px;
        line-height: 24px;
        color: var(--text-2);
      }
      /* The on-screen Back button (UI-INPUT-10). */
      .menu-back {
        position: absolute;
        left: 12px;
        top: 12px;
        /* ≥ 44 CSS px even on a 390 px wide phone (scale 0.81, UI-INPUT-11). */
        min-width: 96px;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: var(--r-control);
        background: var(--glass);
        color: var(--text-2);
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 120ms var(--ease),
          color 120ms var(--ease);
      }
      .menu-back:hover {
        color: var(--text);
        background: var(--glass-2);
      }
      /* A locked level shakes when confirmed (UI-LEVEL-04). */
      .shake {
        animation: menu-shake 0.3s linear;
      }
      @keyframes menu-shake {
        20%,
        60% {
          translate: -6px 0;
        }
        40%,
        80% {
          translate: 6px 0;
        }
      }

      /* The loading screen (UI-LOAD-05): the text, a slim cyan gauge, the percent, on plain
         night. */
      .loading-screen {
        justify-content: center;
        gap: 16px;
        background: var(--night);
      }
      .loading-text {
        font-size: 28px;
        font-weight: 600;
        color: var(--text);
      }
      .loading-bar {
        width: 320px;
        height: 8px;
        box-sizing: border-box;
        border: 1px solid var(--line-2);
        border-radius: 4px;
        overflow: hidden;
        background: var(--glass);
      }
      .loading-fill {
        height: 100%;
        background: var(--cyan);
      }
      .loading-percent {
        font-family: var(--font-tech);
        font-size: 16px;
        font-variant-numeric: tabular-nums;
        color: var(--text-3);
      }

      /* The title: high score, logo, Start, Settings, the hint and the version (UI-TITLE-01). */
      .title-score {
        margin-top: 0;
      }
      .title-score-label {
        font-size: 16px;
        line-height: 24px;
        color: var(--text-2);
      }
      .title-high-score {
        font-family: var(--font-tech);
        font-size: 32px;
        font-weight: 600;
        line-height: 40px;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      /* The logo (UI-LOOK-12), the title's one rich moment: black italic capitals in a cold 80s
         chrome (a hard navy horizon across the middle), a thin pale outline and a solid teal
         edge cast down and right in hard, unblurred layers (`title_logo_depth`, 6 px). It sits
         on the horizon line, a cyan bar. Nothing behind it; nothing glows or
         moves. */
      .title-name {
        position: relative;
        margin: 24px 0 0;
        padding: 8px 24px 24px;
        /* `title_logo_size`; shrinkToFit() lowers it when the system falls back to a wider font
           (UI-LOOK-13). */
        font-size: 60px;
        font-weight: 900;
        font-style: italic;
        line-height: 64px;
        letter-spacing: 0.02em;
        white-space: nowrap;
        text-transform: uppercase;
        text-shadow: none;
        color: transparent;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #d4fbff 38%,
          #7fe9f7 49%,
          #0b3a5a 50%,
          #05607a 56%,
          var(--cyan) 72%,
          #c8fbff 100%
        );
        background-size: 100% 64px;
        background-position: 0 8px;
        background-repeat: no-repeat;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-stroke: 1px rgba(236, 253, 255, 0.5);
        filter: drop-shadow(1px 1px 0 #05607a) drop-shadow(1px 1px 0 #044a5e)
          drop-shadow(1px 1px 0 #033a4b) drop-shadow(1px 1px 0 #022a38)
          drop-shadow(1px 1px 0 #022a38) drop-shadow(1px 1px 0 #011a24);
      }
      /* The horizon line under the logo: a 4 px cyan bar, inset under the letters. */
      .title-name::after {
        content: '';
        position: absolute;
        left: 48px;
        right: 48px;
        bottom: 8px;
        height: 4px;
        background: var(--cyan);
      }
      .title-start,
      .title-settings,
      .title-fullscreen,
      .title-dev {
        width: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .title-start {
        min-height: 56px;
        margin-top: 24px;
        font-size: 32px;
      }
      /* Settings entry under Start (UI-TITLE-01), and the Full screen entry under it
         (UI-TITLE-11). */
      .title-settings,
      .title-fullscreen {
        min-height: 44px;
        margin-top: 12px;
        font-size: 24px;
      }
      .title-start.selected::before,
      .title-settings.selected::before,
      .title-fullscreen.selected::before,
      .title-dev.selected::before {
        content: '▶';
        font-size: 0.6em;
      }
      .title-start.selected::after,
      .title-settings.selected::after,
      .title-fullscreen.selected::after {
        content: '◀';
        font-size: 0.6em;
      }
      .title-hint {
        margin-top: auto;
        margin-bottom: 24px;
      }
      /* Version and commit (UI-TITLE-04). */
      .title-version {
        position: absolute;
        right: 16px;
        bottom: 12px;
        font-family: var(--font-tech);
        font-size: 11px;
        line-height: 16px;
        text-align: right;
        color: var(--text-3);
      }

      /* D-249: the menus keep a column about as wide as the old 3:4 screen in the middle of the
         16:9 one (`--menu-column`), so the cards, sliders and entries are not stretched. */
      .ship-cards {
        display: flex;
        gap: 8px;
        width: 100%;
        max-width: var(--menu-column);
        margin-top: auto;
      }
      .ship-card {
        flex: 1;
        padding: 8px 4px 12px;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        opacity: 0.64;
        transition:
          background-color 120ms var(--ease),
          border-color 120ms var(--ease),
          opacity 120ms var(--ease);
      }
      .ship-card:not(.selected) .ship-card-stat {
        color: var(--text-2);
      }
      /* The highlighted ship's marker (UI-SHIP-03). */
      .ship-card::before {
        content: '▲';
        display: block;
        font-size: 12px;
        line-height: 16px;
        visibility: hidden;
      }
      .ship-card.selected::before {
        visibility: visible;
      }
      .ship-card.selected {
        opacity: 1;
      }
      .ship-card-name {
        margin-bottom: 4px;
        white-space: nowrap;
        font-size: 24px;
        font-weight: 600;
        line-height: 28px;
      }
      .ship-select-screen .menu-hint {
        margin: 16px 0 8px;
      }

      /* The level grid (UI-LEVEL-09): the grid, the status and the hint centred together in the
         height under the heading. */
      .level-grid {
        display: grid;
        gap: 12px;
        margin-top: auto;
      }
      .level-select-screen .menu-hint {
        margin-bottom: auto;
      }
      .level-cell {
        position: relative;
        width: 68px;
        height: 68px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: var(--font-tech);
        font-size: 24px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      /* Locked: dim, hazard-striped; selected, a red frame instead of the cyan block. */
      .level-cell.locked,
      .level-cell.locked:hover {
        color: var(--text-3);
        border-color: var(--line);
        background:
          repeating-linear-gradient(-45deg, rgba(95, 127, 137, 0.14) 0 6px, transparent 6px 12px),
          var(--glass);
        text-shadow: none;
      }
      .level-cell.locked.selected {
        color: var(--red);
        border-color: var(--red);
      }
      .level-cell.selected {
        outline: 3px dashed var(--text);
        outline-offset: 4px;
      }
      .padlock {
        width: 16px;
        height: 16px;
        margin-top: 4px;
      }
      .menu-status {
        min-height: 32px;
        margin: 8px 0 4px;
        font-size: 24px;
        font-weight: 600;
        line-height: 32px;
        color: var(--red);
      }

      /* Game screen: the playfield shows through; drag anywhere to fly (touch, GAME-CTRL-04). */
      .game-screen {
        justify-content: center;
        touch-action: none;
      }
      /* The level played: under the high score, at the top left of the playfield window
         (UI-HUD-06, D-317). */
      .game-level {
        position: absolute;
        z-index: 2;
        left: calc(var(--hud-side) + 12px);
        top: 56px;
        font-family: var(--font-tech);
        font-size: 12px;
        line-height: 16px;
        color: var(--text-2);
        text-shadow: var(--outline);
        pointer-events: none;
      }
      /* In-game HUD (D-317): no panels and no backgrounds, only outlined text and slim gauges in
         the corners of the playfield window, 12 px in, so the level shows through everywhere.
         Score top left, lives and bombs top right, the boss gauge between them during a fight,
         the progress as a rail up the right edge, the health bottom left, the weapon bottom
         right (UI-HUD-01, laid out without overlap, UI-HUD-08). Never takes clicks (UI-HUD-11). */
      .game-hud {
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--hud-side);
        right: var(--hud-side);
        pointer-events: none;
        font-family: var(--font-tech);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        text-shadow: var(--outline);
      }
      /* Low health (UI-HUD-04): the window's edges glow red, pulsing (opacity only: cheap). The one
         loop of the UI: it tells a live danger (UI-LOOK-14). */
      .game-hud::before {
        content: '';
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 72px rgba(255, 59, 71, 0.45);
        opacity: 0;
        transition: opacity 0.3s var(--ease);
      }
      .game-hud.hud-low::before {
        animation: hud-alarm 1.1s ease-in-out infinite alternate;
      }
      @keyframes hud-alarm {
        from {
          opacity: 0.15;
        }
        to {
          opacity: 0.85;
        }
      }
      /* Score (UI-HUD-05), top left: its padding zeros dim, the high score under it. */
      .hud-score {
        position: absolute;
        top: 12px;
        left: 12px;
        white-space: nowrap;
      }
      .hud-score-value {
        font-size: 24px;
        font-weight: 600;
        line-height: 28px;
        color: var(--text);
      }
      .hud-score-lead {
        opacity: 0.3;
      }
      .hud-high-score {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-2);
      }
      /* Lives and bombs (UI-HUD-03), top right, one under the other. */
      .hud-stock {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        font-size: 16px;
        font-weight: 600;
        line-height: 20px;
        white-space: nowrap;
      }
      .hud-lives {
        color: var(--green);
      }
      .hud-bombs {
        color: var(--orange);
      }
      /* Level progress (UI-HUD-02): a hairline rail up the right edge of the window, filled from
         the bottom in solid cyan, a near-white bead where the fill ends: the ship climbing the
         level. */
      .hud-progress {
        position: absolute;
        top: 104px;
        bottom: 104px;
        right: 4px;
        width: 2px;
        background: var(--line);
      }
      .hud-progress-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--cyan);
      }
      .hud-progress-fill::after {
        content: '';
        position: absolute;
        top: -3px;
        left: -2px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text);
      }
      /* Health (UI-HUD-04), bottom left: the ship's callsign and `HP n / N` over a segmented bar. */
      .hud-health {
        position: absolute;
        left: 12px;
        bottom: 12px;
      }
      .hud-health-label {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-bottom: 4px;
        white-space: nowrap;
        line-height: 16px;
      }
      .hud-ship {
        font-family: var(--font);
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
      }
      .hud-health-text {
        font-size: 12px;
      }
      .hud-low .hud-health-text {
        color: var(--red);
      }
      /* Ten cells of 11 px with 2 px gaps. */
      .hud-bar {
        position: relative;
        width: 130px;
        height: 6px;
        background: rgba(1, 10, 16, 0.5);
      }
      .hud-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, transparent 0 11px, var(--night) 11px 13px);
      }
      .hud-bar-fill {
        height: 100%;
        background: var(--cyan);
      }
      .hud-bar-fill.low {
        background: var(--red);
      }
      /* Weapon (UI-HUD-06), bottom right: its name and one pip per level, lit up to its level. */
      .hud-weapon {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .hud-weapon-name {
        font-family: var(--font);
        font-size: 16px;
        font-weight: 600;
        line-height: 20px;
        color: var(--cyan);
        white-space: nowrap;
      }
      .hud-weapon-pips {
        display: flex;
        gap: 8px;
        padding-right: 1px;
      }
      .hud-pip {
        width: 6px;
        height: 6px;
        transform: rotate(45deg);
        border: 1px solid var(--cyan);
        background: rgba(1, 10, 16, 0.5);
      }
      .hud-pip.on {
        background: var(--cyan);
      }
      /* Touch bomb button (UI-HUD-10), above the fire button in the right side column (outside
         the window this HUD is laid over), only on touch screens. */
      .hud-bomb-button {
        display: none;
        position: absolute;
        z-index: 5;
        right: calc(24px - var(--hud-side));
        bottom: 160px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        font-family: var(--font);
        font-size: 16px;
        font-weight: 600;
        color: var(--on-accent);
        background: var(--orange);
        border: 2px solid var(--orange);
        text-shadow: none;
        pointer-events: auto;
        touch-action: none;
      }
      .hud-bomb-button.empty {
        opacity: 0.36;
      }
      @media (pointer: coarse) {
        .hud-bomb-button {
          display: flex;
        }
      }
      /* Boss gauge (UI-HUD-12, D-317): a slim bar across the top of the window, between the score
         and the lives, the boss's kind and name over it (UI-HUD-16), filled from the left, a notch
         at the end of each part's share (UI-HUD-15); solid red for the danger (UI-HUD-17). */
      .boss-bar {
        position: absolute;
        top: 12px;
        left: 50%;
        width: 200px;
        margin-left: -100px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .boss-bar[hidden] {
        display: none;
      }
      .boss-label {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: center;
        overflow: hidden;
        white-space: nowrap;
        font-family: var(--font);
        font-size: 12px;
        font-weight: 600;
        line-height: 16px;
      }
      .boss-rank {
        color: var(--red);
      }
      .boss-name {
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .boss-track {
        position: relative;
        height: 4px;
        border: 1px solid var(--red);
        background: rgba(1, 10, 16, 0.5);
      }
      .boss-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: var(--red);
      }
      .boss-notch {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        margin-left: -1px;
        background: var(--text);
        opacity: 0.8;
      }
      /* Touch fire button, at the foot of the right column, only on touch screens (keyboard and
         gamepad have their own). */
      .game-fire {
        display: none;
        position: absolute;
        right: 24px;
        bottom: 40px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        font-family: var(--font);
        font-size: 20px;
        font-weight: 600;
        color: var(--on-accent);
        background: var(--cyan);
        border: 2px solid var(--cyan);
        text-shadow: none;
      }
      @media (pointer: coarse) {
        .game-fire {
          display: flex;
        }
      }
      /* Pause menu (UI-PAUSE-07): the last frame dimmed (pause_dim, 50 % black, UI-PAUSE-03) under
         a panel. */
      .pause-dim {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
      }
      .pause-panel {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        min-width: 280px;
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: var(--r-panel);
        background: var(--glass);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        text-align: center;
      }
      .pause-heading {
        margin-bottom: 12px;
      }
      .pause-entry,
      .pause-choice {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 56px;
        padding: 4px 20px;
        font-size: 24px;
      }
      .pause-entry.selected::before {
        content: '▶';
        font-size: 0.6em;
      }
      .pause-question-text {
        margin: 8px 0 16px;
        font-size: 24px;
        font-weight: 600;
        color: var(--text);
      }
      .pause-choices {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      .pause-choice {
        min-width: 112px;
      }
      .pause-hint {
        margin-top: 4px;
      }

      /* Settings screen (UI-SET-08): one slider per volume; over a paused level, dimmed
         (UI-SET-07). */
      .settings-screen.over-level {
        background: rgba(0, 0, 0, 0.5);
      }
      .settings-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: var(--menu-column);
        margin: 56px 0 28px;
      }
      .settings-slider {
        display: grid;
        grid-template-columns: 132px 1fr 36px;
        gap: 12px;
        align-items: center;
        min-height: 64px;
        padding: 4px 16px;
        font-size: 20px;
        text-align: left;
      }
      .slider-bar {
        display: flex;
        gap: 4px;
        align-items: center;
        height: 56px;
        touch-action: none;
      }
      .slider-cell {
        flex: 1;
        height: 20px;
        border-radius: 2px;
        background: var(--line);
      }
      .slider-cell.on {
        background: var(--cyan);
      }
      .settings-slider.selected .slider-cell {
        background: rgba(1, 20, 28, 0.2);
      }
      .settings-slider.selected .slider-cell.on {
        background: var(--on-accent);
      }
      .slider-value {
        font-family: var(--font-tech);
        font-size: 20px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      /* "Level complete" overlay (UI-OVER-01), in the panels' look (UI-OVER-09). */
      .level-complete {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: var(--r-panel);
        background: var(--glass);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        color: var(--text);
        font-weight: 500;
      }
      .level-complete.menu-entry.selected,
      .level-complete.menu-entry:hover {
        color: var(--text);
        border-color: var(--line);
        background: var(--glass);
      }
      .level-complete-heading {
        margin-bottom: 8px;
      }
      .level-complete-level {
        font-family: var(--font-tech);
        font-size: 40px;
        font-weight: 600;
        line-height: 48px;
        color: var(--text);
      }
      .level-complete-enemies {
        font-size: 20px;
        color: var(--text-2);
      }
      /* The attempt's score, and a new high score (UI-OVER-02). */
      .level-complete-score {
        font-family: var(--font-tech);
        font-size: 24px;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .level-complete-high-score {
        font-size: 20px;
        font-weight: 600;
        color: var(--green);
      }
      /* The "Game over" panel (UI-OVER-05). */
      .level-complete.game-over,
      .level-complete.game-over.menu-entry:hover {
        border-color: var(--red);
      }
      .game-over .level-complete-heading {
        color: var(--red);
      }
      .game-over .level-complete-heading::after {
        background: var(--red);
      }
      /* Game over after the mini boss: Continue from the checkpoint, or level select
         (UI-OVER-06). */
      .level-complete-choices {
        display: flex;
        gap: 12px;
      }
      .level-complete-choice {
        display: flex;
        align-items: center;
        padding: 4px 16px;
        font-size: 20px;
      }

      /* Dev entry under Settings (D-199, with ?dev in the URL). */
      .title-dev {
        min-height: 44px;
        margin-top: 12px;
        font-family: var(--font-tech);
        font-size: 16px;
      }
      /* The dev menu (D-199): one entry per viewer. */
      .dev-entries {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: var(--menu-column);
        margin: 48px 0 24px;
      }
      .dev-entry {
        padding: 12px 16px;
        font-size: 20px;
      }
      .dev-entry.selected::before {
        content: '▶ ';
      }
      /* A dev viewer (D-199): its caption over the 3D view, the hint at the bottom. */
      /* A drag turns the model: no page scroll or zoom under the finger, a grab cursor. */
      .dev-viewer-screen {
        touch-action: none;
        cursor: grab;
      }
      .dev-heading {
        margin: 28px 0 0 128px;
        align-self: flex-start;
        font-size: 20px;
        font-weight: 600;
        color: var(--text-2);
      }
      .dev-caption {
        margin-top: 12px;
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: var(--r-control);
        background: var(--glass);
        font-family: var(--font-tech);
      }
      .dev-item {
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
      }
      .dev-position,
      .dev-status {
        font-size: 12px;
        color: var(--text-2);
      }
      .dev-status:empty {
        display: none;
      }
      /* A dev viewer's menu (D-206, DEV-MENU-07): a scrolling panel along the bottom, under the
         model, three items a row, each group's heading on a row of its own before its items. */
      .dev-menu {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 72px;
        height: 104px;
        display: grid;
        grid-template-columns: repeat(var(--dev-columns, 3), minmax(0, 1fr));
        align-content: start;
        gap: 2px;
        padding: 4px;
        box-sizing: border-box;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--text-3) transparent;
        touch-action: pan-y;
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: var(--r-control);
        text-align: left;
        cursor: default;
        z-index: 1;
      }
      .dev-menu .menu-entry {
        flex: none;
        min-height: 24px;
        padding: 2px 8px;
        border-radius: 4px;
        font-family: var(--font-tech);
        font-size: 12px;
        line-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      /* The view buttons of the enemies and bosses viewers (DEV-MENU-21): a row over the menu. */
      .dev-modes {
        position: absolute;
        left: 16px;
        bottom: 184px;
        display: flex;
        gap: 4px;
        z-index: 1;
      }
      .dev-modes .menu-entry {
        min-height: 24px;
        padding: 2px 12px;
        border-radius: 4px;
        font-family: var(--font-tech);
        font-size: 12px;
        line-height: 18px;
        cursor: pointer;
      }
      .dev-menu-group {
        grid-column: 1 / -1;
        margin-top: 8px;
        font-weight: 600;
        color: var(--text-2);
      }
      .dev-menu-group:first-child {
        margin-top: 0;
      }
      .dev-menu-item {
        font-weight: 500;
      }
      /* The group of the prop shown: marked, not filled like the prop itself. */
      .dev-menu .dev-menu-group.selected {
        color: var(--cyan);
        background: var(--glass);
        border-color: var(--cyan);
      }
      .dev-hint {
        margin-top: auto;
        margin-bottom: 16px;
        padding: 4px 12px;
        border-radius: 4px;
        background: var(--glass);
        font-size: 12px;
      }
      /* The dev audio viewers (DEV-MENU-19, DEV-MENU-20): the status under the heading, then the
         buttons in a grid that fills the screen and scrolls, three a row. */
      .dev-audio-screen .menu-heading {
        margin-top: 48px;
      }
      .dev-audio-screen .dev-caption {
        min-height: 20px;
        font-size: 14px;
      }
      .dev-audio-screen .dev-status {
        font-size: 14px;
      }
      .dev-audio-menu {
        position: static;
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        height: auto;
        margin: 12px 0;
        gap: 8px;
        padding: 8px;
      }
      .dev-audio-menu .menu-entry {
        min-height: 36px;
        padding: 4px 12px;
        font-size: 14px;
        line-height: 26px;
      }
      .dev-audio-menu .dev-menu-group {
        margin-top: 8px;
      }
      .dev-audio-menu .dev-menu-group:first-child {
        margin-top: 0;
      }
      .dev-audio-screen .dev-hint {
        margin-top: 0;
      }

      /* Debug tile (DEV-PERF-04) and perf overlay (DEV-PERF-03, F3). */
      .stats-tile,
      .perf-overlay {
        position: fixed;
        top: 8px;
        z-index: 10;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: var(--r-control);
        background: var(--glass);
        font-family: var(--font-tech);
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-2);
        pointer-events: none;
      }
      .stats-tile {
        right: 8px;
      }
      .perf-overlay {
        left: 8px;
        white-space: pre;
      }

      /* A level's loading screen (UI-LOAD-06): shown only if loading takes longer than 300 ms
         (PERF-10). */
      .level-loading {
        z-index: 5;
        opacity: 0;
        animation: level-loading-in 0.15s 0.3s forwards;
      }
      @keyframes level-loading-in {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .menu-enter {
          animation-name: menu-fade-still;
        }
        .game-hud.hud-low::before {
          animation: none;
          opacity: 0.6;
        }
      }
      @keyframes menu-fade-still {
        from {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game-canvas"></canvas>
      <div id="menu"></div>
    </div>
    <div id="fatal" role="alert" hidden></div>
    <!-- ENG-82: relative URLs, so the game works under the GitHub Pages sub-path. The only files
         named here (ENG-123): the vendored Babylon build (ENG-02) and the bundled game
         (ENG-150). -->
    <script src="vendor/babylon.js"></script>
    <script type="module">
      import { main } from './js/game.js';
      main();
    </script>
  </body>
</html>
