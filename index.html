<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Stratoblaster</title>
    <style>
      /*
       * Neon blue/green look (reviewer, 2026-10-30, D-198; was darksynth magenta, D-103):
       * electric cyan and neon green on blue-black (UI-LOOK-03), a cold chrome logo, blue-to-green
       * neon lines, soft neon glows, chamfered glass panels (UI-LOOK-06). The selected entry is a
       * solid cyan block, with its markers. Red stays for danger (low health, game over, locked,
       * the boss), orange for the bombs (UI-LOOK-04). Large type for kids (UI-LOOK-09). System
       * fonts only: works offline (UI-LOOK-11).
       */
      :root {
        --neon: #00e8ff;
        --accent: #3dff9a;
        --deep: #0a5cff;
        --red: #ff2244;
        --black: #010a10;
        --paper: #ecfdff;
        --dim: #6e8f98;
        --glass: rgba(2, 14, 22, 0.8);
        --letterbox: #000407;
        /* D-249: width of the menus' column in the middle of the 16:9 screen (UI-LOOK-02). */
        --menu-column: 560px;
        /* D-252, D-263: width of the side columns round the 540 px wide playfield window, where
           the level is drawn; since D-317 the HUD is laid over the window, the columns are empty
           but for the touch buttons (UI-HUD-01). */
        --hud-side: 370px;
        --glow: rgba(0, 232, 255, 0.55);
        --neon-line: linear-gradient(90deg, #0a5cff, #00b4ff 40%, #00e8ff 65%, #3dff9a 90%, #b4ff4a);
        --chrome: linear-gradient(
          180deg,
          #ffffff 0%,
          #d4fbff 40%,
          #0b3a5a 50%,
          #4ff0ff 60%,
          #e4fff4 100%
        );
        --font:
          'Bahnschrift', 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', 'Segoe UI', system-ui,
          sans-serif;
        --font-tech: 'Consolas', 'Menlo', 'DejaVu Sans Mono', 'Liberation Mono', monospace;
        --cut: 14px;
        /* Panel with its top-left and bottom-right corners cut off. */
        --chamfer: polygon(
          var(--cut) 0,
          100% 0,
          100% calc(100% - var(--cut)),
          calc(100% - var(--cut)) 100%,
          0 100%,
          0 var(--cut)
        );
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--letterbox);
        color: var(--paper);
        font-family: var(--font);
      }
      /* No screen overlay on the stage (UI-LOOK-07); #menu, laid out at the logical resolution,
         is scaled over it (UI-LOOK-01). */
      #stage {
        position: fixed;
        overflow: hidden;
        background: var(--black);
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #menu {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      /* Phone layout (UI-LOOK-02, D-286): on a stage scaled under 0.5 (`PHONE_SCALE`), every menu,
         the pause menu and the end-of-level panels are laid out across the whole window at their
         real size, so their touch targets keep their 44 CSS px (UI-INPUT-11). The HUD of a level
         being played (`.on-play`) keeps to the stage; under a panel it is hidden. */
      #menu.phone:not(.on-play) {
        position: fixed;
        left: 0 !important;
        top: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        transform: none !important;
      }
      /* The menus have the game's aspect ratio (D-319, owner: "make the main menues the same aspect
         ratio as the game"): every screen is laid out in the 540 x 720 playfield window in the
         middle of the stage, where the menus' 3D scenes are drawn too, between opaque side
         columns, the same round a level (UI-LOOK-02, D-317). The game screen keeps the whole
         stage (its HUD is laid over the window itself), the dev viewer's 3D views the whole
         stage, a phone's menus the whole window (D-286). */
      #menu:not(.phone):not(:has(.dev-viewer-screen))::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          var(--black) calc(var(--hud-side) - 1px),
          rgba(0, 232, 255, 0.45) calc(var(--hud-side) - 1px) var(--hud-side),
          transparent var(--hud-side) calc(100% - var(--hud-side)),
          rgba(0, 232, 255, 0.45) calc(100% - var(--hud-side)) calc(100% - var(--hud-side) + 1px),
          var(--black) calc(100% - var(--hud-side) + 1px)
        );
      }
      #menu:not(.phone) .menu-screen:not(.game-screen, .dev-viewer-screen) {
        left: var(--hud-side);
        right: var(--hud-side);
      }
      #menu.phone .level-cell {
        width: 60px;
        height: 60px;
      }
      #menu.phone:not(.on-play) .game-hud,
      #menu.phone:not(.on-play) .boss-bar,
      #menu.phone:not(.on-play) .game-level,
      #menu.phone:not(.on-play) .game-fire {
        display: none;
      }
      /* The message shown when the game cannot run (UI-LOAD-02). */
      #fatal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-size: 22px;
        line-height: 1.5;
        background: var(--letterbox);
      }
      #fatal[hidden] {
        display: none;
      }

      .menu-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
        padding: 24px 16px;
        text-align: center;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
      }
      /* Screen frame: a thin neon line, cyan at the top fading to deep blue, softly glowing. */
      .menu-screen::before {
        content: '';
        position: absolute;
        inset: 6px;
        pointer-events: none;
        border: 1px solid transparent;
        border-image: linear-gradient(180deg, var(--neon), rgba(10, 92, 255, 0.35)) 1;
        box-shadow:
          0 0 14px rgba(0, 232, 255, 0.25),
          inset 0 0 18px rgba(10, 92, 255, 0.2);
      }
      /* The neon line along the bottom of every screen. */
      .menu-screen::after {
        content: '';
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 6px;
        height: 3px;
        pointer-events: none;
        background: var(--neon-line);
        box-shadow: 0 0 12px var(--glow);
      }
      /* Short screen transitions (UI-FLOW-08). */
      .menu-enter {
        animation-name: menu-fade;
        animation-timing-function: ease-out;
      }
      @keyframes menu-fade {
        from {
          opacity: 0;
          transform: translateX(-10px);
          filter: brightness(2.5);
        }
      }
      .menu-entry {
        cursor: pointer;
        box-sizing: border-box;
        min-width: 44px;
        min-height: 44px;
        border: 2px solid rgba(61, 255, 154, 0.45);
        background:
          linear-gradient(-45deg, var(--accent) 0 7px, transparent 7px) bottom right / 16px 16px
            no-repeat,
          var(--glass);
      }
      /* Selected entry: solid cyan block with black text, plus its markers, so it shows
         without colour too (much lighter than the dark panels in greyscale, UI-LOOK-08). */
      .menu-entry.selected {
        border-color: var(--paper);
        color: var(--black);
        text-shadow: none;
        background:
          linear-gradient(-45deg, var(--black) 0 7px, transparent 7px) bottom right / 16px 16px
            no-repeat,
          linear-gradient(180deg, #8ff6ff, var(--neon) 55%, #00a6c8);
        box-shadow: 0 0 22px var(--glow);
      }
      .menu-heading {
        margin: 68px 0 0;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--paper);
        text-shadow:
          0 0 6px var(--neon),
          0 0 18px rgba(10, 92, 255, 0.9),
          0 0 4px rgba(0, 0, 0, 0.9);
      }
      /* Hints pulse gently; not with reduced motion (UI-LOOK-14). */
      .menu-hint {
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #b8fff0;
        animation: hint-pulse 2.4s ease-in-out infinite;
      }
      @keyframes hint-pulse {
        50% {
          opacity: 0.55;
        }
      }
      /* The on-screen Back button (UI-INPUT-10). */
      .menu-back {
        position: absolute;
        left: 12px;
        top: 12px;
        /* ≥ 44 CSS px even on a 390 px wide phone (scale 0.81, UI-INPUT-11). */
        min-width: 96px;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 0 12px;
        border: 2px solid var(--accent);
        clip-path: var(--chamfer);
        background: var(--glass);
        color: var(--accent);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }
      /* A locked level shakes when confirmed (UI-LEVEL-04). */
      .shake {
        animation: menu-shake 0.3s linear;
      }
      @keyframes menu-shake {
        20%,
        60% {
          translate: -6px 0;
        }
        40%,
        80% {
          translate: 6px 0;
        }
      }

      /* The loading screen (UI-LOAD-05): a neon grid floor under a deep blue horizon glow. */
      .loading-screen {
        justify-content: center;
        gap: 16px;
        background:
          linear-gradient(rgba(0, 232, 255, 0.1) 1px, transparent 1px) 0 0 / 32px 32px,
          linear-gradient(90deg, rgba(0, 232, 255, 0.1) 1px, transparent 1px) 0 0 / 32px 32px,
          radial-gradient(ellipse at 50% 100%, rgba(10, 92, 255, 0.4), transparent 60%),
          var(--black);
      }
      .loading-text {
        font-size: 30px;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--paper);
        text-shadow:
          0 0 8px var(--neon),
          0 0 20px rgba(10, 92, 255, 0.9);
      }
      .loading-bar {
        width: 320px;
        height: 24px;
        box-sizing: border-box;
        padding: 3px;
        border: 2px solid var(--neon);
        overflow: hidden;
        background: var(--glass);
      }
      /* Segmented fill, like a power gauge. */
      .loading-fill {
        height: 100%;
        background:
          repeating-linear-gradient(90deg, transparent 0 10px, var(--black) 10px 13px),
          var(--neon-line);
      }
      .loading-percent {
        font-family: var(--font-tech);
        font-size: 18px;
        color: var(--accent);
      }

      /* The title: high score, logo, Start, Settings, the hint and the version (UI-TITLE-01). */
      .title-score-label {
        font-family: var(--font-tech);
        font-size: 15px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .title-high-score {
        font-family: var(--font-tech);
        font-size: 32px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--neon);
      }
      /* 80s chrome letters (a horizon line across the middle) in a slow neon glow (UI-LOOK-12). */
      .title-name {
        margin: 40px 0 0;
        padding: 6px 24px;
        /* Sized so the 13-letter "Stratoblaster" fits the screen's width (1280 px since D-249;
           it was sized for 480); shrinkToFit() lowers it when the system falls back to a wider
           font (UI-LOOK-13). */
        font-size: 46px;
        font-weight: 900;
        font-style: italic;
        letter-spacing: 0.05em;
        white-space: nowrap;
        text-transform: uppercase;
        color: transparent;
        text-shadow: none;
        background: var(--chrome);
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(0 0 6px var(--neon)) drop-shadow(0 0 16px rgba(10, 92, 255, 0.8));
        animation: title-glow 3.5s ease-in-out infinite;
      }
      @keyframes title-glow {
        50% {
          filter: drop-shadow(0 0 10px var(--neon)) drop-shadow(0 0 26px rgba(61, 255, 154, 0.8));
        }
      }
      .title-start {
        margin-top: 56px;
        padding: 10px 28px;
        clip-path: var(--chamfer);
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .title-start.selected::before {
        content: '▶ ';
      }
      .title-start.selected::after {
        content: ' ◀';
      }
      /* Settings entry under Start (UI-TITLE-01), and the Full screen entry under it
         (UI-TITLE-11). */
      .title-settings,
      .title-fullscreen {
        margin-top: 18px;
        padding: 8px 22px;
        clip-path: var(--chamfer);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .title-start:not(.selected) {
        font-size: 28px;
      }
      .title-settings.selected::before,
      .title-fullscreen.selected::before {
        content: '▶ ';
      }
      .title-settings.selected::after,
      .title-fullscreen.selected::after {
        content: ' ◀';
      }
      .title-hint {
        margin-top: auto;
        margin-bottom: 28px;
      }
      /* Version and commit (UI-TITLE-04). */
      .title-version {
        position: absolute;
        right: 16px;
        bottom: 14px;
        font-family: var(--font-tech);
        font-size: 11px;
        text-align: right;
        color: var(--accent);
        opacity: 0.85;
      }

      /* D-249: the menus keep a column about as wide as the old 3:4 screen in the middle of the
         16:9 one (`--menu-column`), so the cards, sliders and entries are not stretched. */
      .ship-cards {
        display: flex;
        width: 100%;
        max-width: var(--menu-column);
        margin-top: auto;
      }
      .ship-card {
        flex: 1;
        margin: 0 3px;
        padding: 6px 2px 8px;
        clip-path: var(--chamfer);
        font-size: 12px;
        line-height: 1.5;
        opacity: 0.6;
      }
      /* The highlighted ship's marker (UI-SHIP-03). */
      .ship-card::before {
        content: '▲';
        display: block;
        font-size: 16px;
        line-height: 1;
        visibility: hidden;
      }
      .ship-card.selected::before {
        visibility: visible;
      }
      .ship-card.selected {
        opacity: 1;
      }
      .ship-card-name {
        white-space: nowrap;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .ship-select-screen .menu-hint {
        margin: 12px 0 8px;
      }

      /* The level grid (UI-LEVEL-09). */
      .level-grid {
        display: grid;
        gap: 10px;
        margin-top: 40px;
      }
      /* No clip-path here: it would hide the dashed outline of the selected cell. */
      .level-cell {
        position: relative;
        width: 68px;
        height: 68px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: var(--font-tech);
        font-size: 22px;
        font-weight: 700;
      }
      .level-cell:not(.locked) {
        border-color: var(--accent);
      }
      .level-cell.selected:not(.locked) {
        border-color: var(--paper);
      }
      /* Locked: dim, hazard-striped panel; selected, a red frame instead of the cyan block. */
      .level-cell.locked {
        color: var(--dim);
        border-color: rgba(110, 143, 152, 0.3);
        background:
          repeating-linear-gradient(-45deg, rgba(110, 143, 152, 0.1) 0 6px, transparent 6px 12px),
          rgba(6, 16, 22, 0.85);
        text-shadow: none;
        box-shadow: none;
      }
      .level-cell.locked.selected {
        color: var(--red);
        border-color: var(--red);
      }
      .level-cell.selected {
        outline: 3px dashed var(--paper);
        outline-offset: 3px;
      }
      .padlock {
        width: 18px;
        height: 18px;
        margin-top: 2px;
      }
      .menu-status {
        min-height: 32px;
        margin-top: 16px;
        font-family: var(--font-tech);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--red);
      }

      /* Game screen: the playfield shows through; drag anywhere to fly (touch, GAME-CTRL-04). */
      .game-screen {
        justify-content: center;
        touch-action: none;
      }
      /* The level played: small and dim under the score, at the top left of the playfield window
         (UI-HUD-06, D-317). */
      .game-level {
        position: absolute;
        z-index: 2;
        left: calc(var(--hud-side) + 12px);
        top: 50px;
        font-family: var(--font-tech);
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--paper);
        opacity: 0.55;
        text-shadow:
          0 0 3px #000,
          0 1px 2px #000;
        pointer-events: none;
      }
      /* No neon line over the playfield (UI-LOOK-05). */
      .game-screen::after {
        content: none;
      }
      /* No screen frame over the playfield either; the empty side columns round the playfield
         window are `#menu`'s, as round the menus (D-317, D-319). */
      .game-screen::before {
        content: none;
      }
      /* In-game HUD (D-317, owner: the UI back in the playing area, light, designed afresh): no
         panels and no backgrounds, only outlined text and slim gauges in the corners of the
         playfield window, so the level shows through everywhere. Score top left, lives and bombs
         top right, the boss gauge between them during a fight, the progress as a rail up the
         right edge, the health bottom left, the weapon bottom right (UI-HUD-01, laid out without
         overlap, UI-HUD-08). The side columns outside the window are left empty but for the touch
         buttons (UI-HUD-10). Never takes clicks (UI-HUD-11). */
      .game-hud {
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--hud-side);
        right: var(--hud-side);
        pointer-events: none;
        font-family: var(--font-tech);
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--paper);
        text-shadow:
          0 0 3px #000,
          0 1px 2px #000;
      }
      /* Low health (UI-HUD-04): the window's edges glow red, pulsing (opacity only: cheap). */
      .game-hud::before {
        content: '';
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 70px rgba(255, 34, 68, 0.45);
        opacity: 0;
        transition: opacity 0.3s;
      }
      .game-hud.hud-low::before {
        animation: hud-alarm 1.1s ease-in-out infinite alternate;
      }
      @keyframes hud-alarm {
        from {
          opacity: 0.15;
        }
        to {
          opacity: 0.85;
        }
      }
      /* Score (UI-HUD-05), top left: its padding zeros dim, the high score small under it. */
      .hud-score {
        position: absolute;
        top: 8px;
        left: 12px;
        white-space: nowrap;
      }
      .hud-score-value {
        font-size: 22px;
        font-weight: 700;
        line-height: 24px;
        color: var(--paper);
        text-shadow:
          0 0 3px #000,
          0 0 8px rgba(0, 232, 255, 0.6);
      }
      .hud-score-lead {
        opacity: 0.28;
      }
      .hud-high-score {
        font-size: 11px;
        line-height: 14px;
        letter-spacing: 0.14em;
        color: var(--accent);
        opacity: 0.85;
      }
      /* Lives and bombs (UI-HUD-03), top right, one under the other. */
      .hud-stock {
        position: absolute;
        top: 9px;
        right: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        font-size: 15px;
        font-weight: 700;
        line-height: 18px;
        white-space: nowrap;
      }
      .hud-lives {
        color: var(--accent);
      }
      .hud-bombs {
        color: #ff8a1e;
      }
      /* Level progress (UI-HUD-02): a hairline rail up the right edge of the window, filled from
         the bottom in the neon line, a bright bead where the fill ends: the ship climbing the
         level. */
      .hud-progress {
        position: absolute;
        top: 104px;
        bottom: 104px;
        right: 5px;
        width: 2px;
        background: rgba(236, 253, 255, 0.14);
      }
      .hud-progress-fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(0deg, #0a5cff, #00b4ff 40%, #00e8ff 65%, #3dff9a 90%, #b4ff4a);
        box-shadow: 0 0 5px var(--neon);
      }
      .hud-progress-fill::after {
        content: '';
        position: absolute;
        top: -3px;
        left: -2px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--paper);
        box-shadow: 0 0 6px var(--accent);
      }
      /* Health (UI-HUD-04), bottom left: the ship's callsign and `HP n / N` over a segmented bar. */
      .hud-health {
        position: absolute;
        left: 12px;
        bottom: 12px;
      }
      .hud-health-label {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-bottom: 4px;
        white-space: nowrap;
      }
      .hud-ship {
        font-size: 9px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--neon);
        opacity: 0.7;
      }
      .hud-health-text {
        font-size: 11px;
      }
      .hud-low .hud-health-text {
        color: var(--red);
      }
      /* Ten cells of 11 px with 2 px gaps. */
      .hud-bar {
        position: relative;
        width: 130px;
        height: 6px;
        background: rgba(1, 10, 16, 0.4);
      }
      .hud-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, transparent 0 11px, var(--black) 11px 13px);
        opacity: 0.85;
      }
      .hud-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--deep), var(--neon));
        box-shadow: 0 0 6px var(--neon);
      }
      .hud-bar-fill.low {
        background: var(--red);
        box-shadow: 0 0 6px var(--red);
      }
      /* Weapon (UI-HUD-06), bottom right: its name and one pip per level, lit up to its level. */
      .hud-weapon {
        position: absolute;
        right: 14px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .hud-weapon-name {
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--neon);
        white-space: nowrap;
      }
      .hud-weapon-pips {
        display: flex;
        gap: 6px;
        padding-right: 1px;
      }
      .hud-pip {
        width: 6px;
        height: 6px;
        transform: rotate(45deg);
        border: 1px solid rgba(0, 232, 255, 0.7);
        background: rgba(1, 10, 16, 0.4);
      }
      .hud-pip.on {
        background: var(--neon);
        box-shadow: 0 0 5px var(--neon);
      }
      /* Touch bomb button (UI-HUD-10), above the fire button in the right side column (outside
         the window this HUD is laid over), only on touch screens. */
      .hud-bomb-button {
        display: none;
        position: absolute;
        z-index: 5;
        right: calc(24px - var(--hud-side));
        bottom: 160px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--black);
        background: rgba(255, 138, 30, 0.55);
        border: 3px solid #ff8a1e;
        text-shadow: none;
        pointer-events: auto;
        touch-action: none;
      }
      .hud-bomb-button.empty {
        opacity: 0.35;
      }
      @media (pointer: coarse) {
        .hud-bomb-button {
          display: flex;
        }
      }
      /* Boss gauge (UI-HUD-12, D-317): a slim bar across the top of the window, between the score
         and the lives, the boss's kind and name over it (UI-HUD-16), filled from the left, a notch
         at the end of each part's share (UI-HUD-15); red for the danger (UI-HUD-17). Thin and high
         up, it hides next to nothing of the boss below it. */
      .boss-bar {
        position: absolute;
        top: 12px;
        left: 50%;
        width: 200px;
        margin-left: -100px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .boss-bar[hidden] {
        display: none;
      }
      .boss-label {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: center;
        overflow: hidden;
        text-transform: uppercase;
        white-space: nowrap;
        font-size: 11px;
        line-height: 13px;
      }
      .boss-rank {
        font-size: 9px;
        color: var(--red);
        letter-spacing: 0.2em;
      }
      .boss-name {
        color: var(--neon);
        letter-spacing: 0.1em;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .boss-track {
        position: relative;
        height: 4px;
        border: 1px solid var(--red);
        background: rgba(1, 10, 16, 0.4);
      }
      .boss-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: linear-gradient(90deg, #7a0016, var(--red) 60%, #ff5a3c);
        box-shadow: 0 0 6px var(--red);
      }
      .boss-notch {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        margin-left: -1px;
        background: var(--paper);
        opacity: 0.8;
      }
      /* Touch fire button, at the foot of the right column, only on touch screens (keyboard and
         gamepad have their own). */
      .game-fire {
        display: none;
        position: absolute;
        right: 24px;
        bottom: 40px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        font-family: var(--font-tech);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--black);
        background: rgba(0, 232, 255, 0.55);
        border: 3px solid var(--neon);
        text-shadow: none;
      }
      @media (pointer: coarse) {
        .game-fire {
          display: flex;
        }
      }
      /* Pause menu (UI-PAUSE-07): the last frame dimmed (pause_dim, 50 % black, UI-PAUSE-03) under
         a panel. */
      .pause-dim {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
      }
      .pause-panel {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        min-width: 280px;
        padding: 24px 32px;
        clip-path: var(--chamfer);
        border: 2px solid var(--neon);
        background: var(--glass);
      }
      .pause-heading {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--paper);
        text-shadow:
          0 0 6px var(--neon),
          0 0 18px rgba(10, 92, 255, 0.9);
      }
      .pause-entry,
      .pause-choice {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        padding: 6px 20px;
        clip-path: var(--chamfer);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .pause-entry.selected::before {
        content: '▶ ';
      }
      .pause-question-text {
        margin: 8px 0 14px;
        font-size: 24px;
        font-weight: 700;
        color: var(--paper);
      }
      .pause-choices {
        display: flex;
        gap: 14px;
        justify-content: center;
      }
      .pause-choice {
        min-width: 110px;
      }
      .pause-hint {
        margin-top: 4px;
      }

      /* Settings screen (UI-SET-08): one slider per volume; over a paused level, dimmed
         (UI-SET-07). */
      .settings-screen.over-level {
        background: rgba(0, 0, 0, 0.5);
      }
      .settings-list {
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: 100%;
        max-width: var(--menu-column);
        margin: 56px 0 28px;
      }
      .settings-slider {
        display: grid;
        grid-template-columns: 130px 1fr 34px;
        gap: 10px;
        align-items: center;
        min-height: 64px;
        padding: 4px 14px;
        clip-path: var(--chamfer);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-align: left;
        text-transform: uppercase;
      }
      .slider-bar {
        display: flex;
        gap: 3px;
        align-items: center;
        height: 56px;
        touch-action: none;
      }
      .slider-cell {
        flex: 1;
        height: 22px;
        background: rgba(61, 255, 154, 0.18);
        border: 1px solid rgba(61, 255, 154, 0.45);
      }
      .slider-cell.on {
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent);
      }
      .settings-slider.selected .slider-cell {
        background: rgba(0, 0, 0, 0.15);
        border-color: rgba(0, 0, 0, 0.5);
        box-shadow: none;
      }
      .settings-slider.selected .slider-cell.on {
        background: var(--black);
      }
      .slider-value {
        font-family: var(--font-tech);
        font-size: 22px;
        text-align: right;
      }

      /* "Level complete" overlay (UI-OVER-01), in the panels' look (UI-OVER-09). */
      .level-complete {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px 32px;
        clip-path: var(--chamfer);
        border: 2px solid var(--neon);
        background: var(--glass);
        color: var(--paper);
      }
      .level-complete.menu-entry.selected {
        color: var(--paper);
        background: var(--glass);
      }
      .level-complete-heading {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--neon);
      }
      .level-complete-level {
        font-family: var(--font-tech);
        font-size: 40px;
        font-weight: 700;
        color: var(--accent);
      }
      .level-complete-enemies {
        font-size: 22px;
      }
      /* The attempt's score, and a new high score (UI-OVER-02). */
      .level-complete-score {
        font-family: var(--font-tech);
        font-size: 24px;
        color: var(--neon);
      }
      .level-complete-high-score {
        font-size: 20px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--accent);
      }
      /* The "Game over" panel (UI-OVER-05). */
      .level-complete.game-over {
        border-color: var(--red);
      }
      .game-over .level-complete-heading {
        color: var(--red);
      }
      /* Game over after the mini boss: Continue from the checkpoint, or level select
         (UI-OVER-06). */
      .level-complete-choices {
        display: flex;
        gap: 12px;
      }
      .level-complete-choice {
        padding: 6px 14px;
        font-size: 20px;
        font-weight: 700;
        text-transform: uppercase;
        border: 2px solid var(--dim);
        color: var(--paper);
      }
      .level-complete-choice.selected {
        border-color: var(--neon);
        color: var(--black);
        background: var(--neon);
      }

      /* Dev entry under Settings (D-199, with ?dev in the URL). */
      .title-dev {
        margin-top: 14px;
        padding: 6px 18px;
        clip-path: var(--chamfer);
        font-family: var(--font-tech);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .title-dev.selected::before {
        content: '▶ ';
      }
      /* The dev menu (D-199): one entry per viewer. */
      .dev-entries {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: var(--menu-column);
        margin: 48px 0 24px;
      }
      .dev-entry {
        padding: 10px 18px;
        clip-path: var(--chamfer);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .dev-entry.selected::before {
        content: '▶ ';
      }
      /* A dev viewer (D-199): its caption over the 3D view, the hint at the bottom. */
      /* A drag turns the model: no page scroll or zoom under the finger, a grab cursor. */
      .dev-viewer-screen {
        touch-action: none;
        cursor: grab;
      }
      .dev-viewer-screen::after {
        content: none;
      }
      .dev-heading {
        margin: 26px 0 0 128px;
        align-self: flex-start;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .dev-caption {
        margin-top: 10px;
        padding: 6px 16px;
        clip-path: var(--chamfer);
        background: var(--glass);
        border: 1px solid rgba(0, 232, 255, 0.45);
        font-family: var(--font-tech);
      }
      .dev-item {
        font-size: 22px;
        font-weight: 700;
        color: var(--paper);
        text-shadow: 0 0 6px var(--neon);
      }
      .dev-position,
      .dev-status {
        font-size: 13px;
        color: var(--accent);
      }
      .dev-status:empty {
        display: none;
      }
      /* A dev viewer's menu (D-206, DEV-MENU-07): a scrolling panel along the bottom, under the
         model (it hid the models down the left side), three items a row, each group's heading on
         a row of its own before its items, so the item shown stays in view. */
      .dev-menu {
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 70px;
        height: 106px;
        display: grid;
        grid-template-columns: repeat(var(--dev-columns, 3), minmax(0, 1fr));
        align-content: start;
        gap: 2px;
        padding: 4px;
        box-sizing: border-box;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--neon) transparent;
        touch-action: pan-y;
        background: var(--glass);
        border: 1px solid rgba(0, 232, 255, 0.35);
        text-align: left;
        cursor: default;
        z-index: 1;
      }
      .dev-menu .menu-entry {
        flex: none;
        min-height: 24px;
        padding: 2px 8px;
        border-width: 1px;
        font-family: var(--font-tech);
        font-size: 11px;
        line-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      /* The view buttons of the enemies and bosses viewers (DEV-MENU-21): a row over the menu. */
      .dev-modes {
        position: absolute;
        left: 14px;
        bottom: 182px;
        display: flex;
        gap: 4px;
        z-index: 1;
      }
      .dev-modes .menu-entry {
        min-height: 24px;
        padding: 2px 14px;
        border-width: 1px;
        font-family: var(--font-tech);
        font-size: 12px;
        font-weight: 700;
        line-height: 18px;
        cursor: pointer;
      }
      .dev-modes .menu-entry.selected {
        color: var(--black);
      }
      .dev-menu-group {
        grid-column: 1 / -1;
        margin-top: 6px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .dev-menu-group:first-child {
        margin-top: 0;
      }
      .dev-menu-item {
        font-weight: 600;
        color: var(--paper);
      }
      .dev-menu .menu-entry.selected {
        color: var(--black);
      }
      /* The group of the prop shown: marked, not filled like the prop itself. */
      .dev-menu .dev-menu-group.selected {
        color: var(--neon);
        background: var(--glass);
        border-color: var(--neon);
        box-shadow: none;
      }
      .dev-hint {
        margin-top: auto;
        margin-bottom: 14px;
        padding: 4px 10px;
        background: var(--glass);
        font-size: 11px;
      }
      /* The dev audio viewers (DEV-MENU-19, DEV-MENU-20): the status under the heading, then the
         buttons in a grid that fills the screen and scrolls, three a row. */
      .dev-audio-screen .menu-heading {
        margin-top: 48px;
      }
      .dev-audio-screen .dev-caption {
        min-height: 20px;
        font-size: 14px;
      }
      .dev-audio-screen .dev-status {
        font-size: 14px;
      }
      .dev-audio-menu {
        position: static;
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        height: auto;
        margin: 12px 0 10px;
        gap: 6px;
        padding: 8px;
      }
      .dev-audio-menu .menu-entry {
        min-height: 36px;
        padding: 4px 10px;
        font-size: 13px;
        line-height: 26px;
      }
      .dev-audio-menu .dev-menu-group {
        margin-top: 8px;
      }
      .dev-audio-menu .dev-menu-group:first-child {
        margin-top: 0;
      }
      .dev-audio-screen .dev-hint {
        margin-top: 0;
      }

      /* Debug tile (DEV-PERF-04): frame rate and polygons drawn, top right of the window. */
      .stats-tile {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 10;
        padding: 6px 10px;
        background: rgba(2, 14, 22, 0.85);
        border: 1px solid rgba(0, 232, 255, 0.5);
        font-family: var(--font-tech);
        font-size: 12px;
        line-height: 1.5;
        color: var(--neon);
        pointer-events: none;
      }

      /* A level's loading screen (UI-LOAD-06): shown only if loading takes longer than 300 ms
         (PERF-10). */
      .level-loading {
        z-index: 5;
        opacity: 0;
        animation: level-loading-in 0.15s 0.3s forwards;
      }
      @keyframes level-loading-in {
        to {
          opacity: 1;
        }
      }

      /* Debug perf overlay (DEV-PERF-03, F3): long frames, longest frame, level loading time. */
      .perf-overlay {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        padding: 6px 10px;
        background: rgba(2, 14, 22, 0.85);
        border: 1px solid rgba(0, 232, 255, 0.5);
        font-family: var(--font-tech);
        font-size: 12px;
        line-height: 1.5;
        color: var(--neon);
        white-space: pre;
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .title-name,
        .menu-hint {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game-canvas"></canvas>
      <div id="menu"></div>
    </div>
    <div id="fatal" role="alert" hidden></div>
    <!-- ENG-82: relative URLs, so the game works under the GitHub Pages sub-path. The only files
         named here (ENG-123): the vendored Babylon build (ENG-02) and the bundled game
         (ENG-150). -->
    <script src="vendor/babylon.js"></script>
    <script type="module">
      import { main } from './js/game.js';
      main();
    </script>
  </body>
</html>
