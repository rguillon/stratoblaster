<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Stratoblaster — Level Zero</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #020204;
        color: #f2f2f7;
        font-family: system-ui, sans-serif;
      }
      #stage {
        position: fixed;
        overflow: hidden;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #fatal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        background: #020204;
      }
      #fatal[hidden] {
        display: none;
      }
      /* Controls float over the top left of the window. */
      .scenery-panel {
        position: fixed;
        top: 8px;
        left: 8px;
        max-width: min(420px, calc(100vw - 16px));
        padding: 8px;
        background: rgba(6, 8, 18, 0.8);
        border: 1px solid rgba(0, 240, 255, 0.4);
        font-size: 13px;
      }
      .scenery-title {
        margin-bottom: 6px;
        color: #fcee0a;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .scenery-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        margin-bottom: 6px;
      }
      .scenery-row button {
        min-width: 44px;
        min-height: 32px;
        padding: 2px 10px;
        border: 1px solid rgba(0, 240, 255, 0.5);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .scenery-row button.selected {
        border-color: #f2f2f7;
        background: #fcee0a;
        color: #050508;
        font-weight: 700;
      }
      .scenery-row button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .scenery-row input[type='range'] {
        width: 90px;
      }
      .scenery-time-slider {
        width: 100%;
        margin: 2px 0 8px;
      }
      .scenery-label {
        font-size: 11px;
        opacity: 0.75;
      }
      .scenery-readout {
        font-family: 'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace;
        font-size: 12px;
        line-height: 1.5;
      }
      .scenery-time {
        color: #00f0ff;
      }
      .scenery-end {
        margin-top: 6px;
        padding: 4px 8px;
        background: #ff2a55;
        color: #050508;
        font-weight: 700;
      }
      .scenery-end[hidden] {
        display: none;
      }
      /* Debug tile: frame rate and polygons drawn, top right. */
      .stats-tile {
        position: fixed;
        top: 8px;
        right: 8px;
        padding: 6px 10px;
        background: rgba(6, 8, 18, 0.8);
        border: 1px solid rgba(252, 238, 10, 0.5);
        font-family: 'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace;
        font-size: 12px;
        line-height: 1.5;
        color: #fcee0a;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game-canvas"></canvas></div>
    <div id="panel"></div>
    <div id="fatal" role="alert" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
